<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ROSE LAB | Práctica de corte</title><script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><style>body{margin:0;font:15px system-ui;color:white;background:#163124}#panel{position:fixed;z-index:10;top:10px;left:10px;width:min(325px,85vw);background:#10291eea;border:1px solid #78a88c;border-radius:14px;padding:13px}button{background:#d6ecad;border:0;border-radius:8px;padding:9px;margin:3px;cursor:pointer;font-weight:bold}button:disabled{opacity:.4;cursor:not-allowed}#flowerbuttons{display:flex;flex-wrap:wrap}#flowerbuttons button.active{background:#ffc953}#message{margin:6px 0;font-weight:600}#result{font-size:13px;color:#d9eedf}#cut{background:#ffce69;font-size:17px}#hint{font-size:12px;color:#cfe6d7}#hide{float:right} @media(max-width:700px){#panel{font-size:13px;max-height:46vh;overflow-y:auto}}</style></head><body><div id="panel"><button id="hide">Ocultar</button><h2>🌹 ROSE LAB</h2><p id="hint">PC: pulsa una flor en pantalla o el número 1–8. Después pulsa <b>E</b> o el botón Cortar. También puedes hacer clic directamente sobre las flores. Quest 3: apunta con el control y usa el gatillo.</p><div id="flowerbuttons"></div><button id="cut" disabled>✂️ Cortar seleccionada (E)</button><button id="finish">Evaluar cosecha</button><button id="reset">Reiniciar</button><button id="export">Exportar CSV</button><p id="message">Selecciona una rosa para comenzar.</p><div id="result">Cortes: 0 · Correctos: 0 · Restantes: 8</div></div><a-scene background="color:#b0d0d5" renderer="colorManagement:true; antialias:true" xr-mode-ui="enabled:true"><a-entity id="rig" position="0 0 6"><a-camera position="0 1.6 0" look-controls wasd-controls="acceleration:17"><a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable;far:25"></a-entity><a-cursor color="yellow" raycaster="objects:.clickable;far:20" fuse="false"></a-cursor></a-camera><a-entity laser-controls="hand:right" raycaster="objects:.clickable;far:20"></a-entity><a-entity laser-controls="hand:left" raycaster="objects:.clickable;far:20"></a-entity></a-entity><a-light type="ambient" intensity="1"></a-light><a-light type="directional" position="-3 8 4" intensity="0.7"></a-light><a-plane rotation="-90 0 0" width="30" height="40" color="#a58b68"></a-plane><a-box position="-1.4 .12 -1" width="1.2" height=".24" depth="12" color="#6a513b"></a-box><a-box position="1.4 .12 -1" width="1.2" height=".24" depth="12" color="#6a513b"></a-box><a-entity id="garden"></a-entity><a-text value="ROSE LAB - CAMAS DE PRACTICA" position="-2 2.6 -6.5" width="4" color="#173324"></a-text></a-scene><script>
const samples=[{stage:1,color:'#c93651',side:-1,z:2.4},{stage:2,color:'#c93651',side:1,z:2.4},{stage:3,color:'#e985a1',side:-1,z:.4},{stage:1,color:'#e985a1',side:1,z:.4},{stage:2,color:'#f2b86b',side:-1,z:-1.6},{stage:2,color:'#d9527d',side:1,z:-1.6},{stage:1,color:'#d9527d',side:-1,z:-3.6},{stage:3,color:'#f2b86b',side:1,z:-3.6}];
let selected=-1,ended=false,start=Date.now(),records=[];const $=id=>document.getElementById(id);function add(t,a,p){let e=document.createElement(t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);p.appendChild(e);return e;}function say(t){$('message').textContent=t}function refresh(){document.querySelectorAll('#flowerbuttons button').forEach((b,i)=>{b.classList.toggle('active',i===selected);b.disabled=samples[i].cut||ended});$('cut').disabled=selected<0||ended;let correct=records.filter(r=>r.correct).length;$('result').textContent=`Cortes: ${records.length} · Correctos: ${correct} · Restantes: ${samples.filter(s=>!s.cut).length}`;}function select(i){let s=samples[i];if(ended||s.cut)return;selected=i;say(`Rosa ${i+1} seleccionada. Decide si cortarla o dejarla crecer.`);refresh();}function cut(){if(selected<0){say('Primero selecciona una rosa con los botones 1–8 o haciendo clic sobre ella.');return;}let i=selected,s=samples[i];if(ended||s.cut)return;s.cut=true;let ok=s.stage===2;records.push({flower:i+1,stage:s.stage,correct:ok,seconds:Math.round((Date.now()-start)/1000)});s.head.setAttribute('animation','property:scale;to:0.01 0.01 0.01;dur:500');s.head.classList.remove('clickable');selected=-1;say(ok?`Rosa ${i+1}: corte registrado, punto 2 en este ejercicio.`:`Rosa ${i+1}: corte no recomendado según el ejemplo (punto ${s.stage}).`);refresh();}
samples.forEach((s,i)=>{s.cut=false;let x=s.side*1.5,z=s.z,root=add('a-entity',{position:`${x} 0 ${z}`},$('garden'));add('a-cylinder',{position:'0 .78 0',radius:'.019',height:'1.56',color:'#317947'},root);for(let k=0;k<4;k++)add('a-sphere',{position:`${k%2?.19:-.19} ${.47+k*.19} 0`,scale:'.3 .09 .13',color:'#347b42'},root);let head=add('a-entity',{position:'0 1.57 0'},root);s.head=head;const p={1:{rad:.10,h:.28,n:4},2:{rad:.17,h:.26,n:6},3:{rad:.24,h:.18,n:8}}[s.stage];add('a-cone',{position:`0 ${p.h*.25} 0`,radiusBottom:p.rad*.8,radiusTop:s.stage===1?.006:p.rad*.43,height:p.h,color:s.color},head);for(let k=0;k<p.n;k++){let a=k*2*Math.PI/p.n;add('a-sphere',{position:`${Math.sin(a)*p.rad*.53} ${p.h*.43} ${Math.cos(a)*p.rad*.53}`,scale:`${p.rad*.68} ${p.h*.7} ${p.rad*.44}`,color:s.color},head);}let clickTarget=add('a-sphere',{position:'0 .06 0',radius:'.28',class:'clickable',material:'color:#ffffff;transparent:true;opacity:0.04;depthWrite:false'},head);clickTarget.addEventListener('click',()=>select(i));let button=document.createElement('button');button.textContent=`Rosa ${i+1}`;button.onclick=()=>select(i);$('flowerbuttons').appendChild(button);});
$('cut').onclick=cut;window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key.toLowerCase()==='e')cut();if(/^[1-8]$/.test(e.key))select(+e.key-1);});$('finish').onclick=()=>{if(ended)return;ended=true;let correct=records.filter(r=>r.correct).length,incorrect=records.length-correct,missed=samples.filter(s=>s.stage===2&&!s.cut).length;let accuracy=(samples.length-incorrect-missed)/samples.length*100;say(`Resultado: ${correct} cortes correctos; ${incorrect} incorrectos; ${missed} listas sin cortar. Exactitud ${accuracy.toFixed(0)}%.`);refresh();};$('reset').onclick=()=>location.reload();$('export').onclick=()=>{let lines=[['rosa','punto_simulado','correcto','segundos'],...records.map(r=>[r.flower,r.stage,r.correct,r.seconds])];let csv=lines.map(row=>row.join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rose-lab-resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};$('hide').onclick=()=>{let panel=$('panel'),hidden=panel.dataset.hidden==='true';panel.dataset.hidden=hidden?'false':'true';[...panel.children].filter(e=>e.id!=='hide').forEach(e=>e.style.display=hidden?'':'none');$('hide').textContent=hidden?'Ocultar':'Mostrar';};document.querySelectorAll('[laser-controls]').forEach(hand=>hand.addEventListener('triggerdown',()=>{let r=hand.components.raycaster;if(r?.intersectedEls?.length)r.intersectedEls[0].emit('click');}));refresh();
</script></body></html>
